name: Contract examples

# The engine-client examples under docs/schema/engine-client/0.2.examples are generated by playing the scenarios
# against a real engine. This fails when a committed file differs from a fresh run.
on:
  push:
    branches: [feat/magnum-opus]
    paths: &paths
      - "src/**"
      - "docs/schema/engine-client/**"
      - "tests/protocol/**"
      - ".github/workflows/contract.yml"
  pull_request:
    branches: [feat/magnum-opus]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: "22"

jobs:
  drift:
    name: Examples match a fresh run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { cache: true }
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libncursesw5-dev \
            libpulse-dev mold gettext parallel libsqlite3-dev zlib1g-dev libvulkan-dev mesa-vulkan-drivers xvfb \
            autoconf autoconf-archive automake libtool libltdl-dev
          sudo apt-get install libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libx11-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libibus-1.0-dev libudev-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev \
            libfreetype-dev libharfbuzz-dev \
            libtiff-dev libavif-dev libwebp-dev libjpeg-dev libjxl-dev \
            libflac-dev libvorbis-dev libxmp-dev libmpg123-dev libwavpack-dev
      - name: Setup LLVM build tools
        uses: aminya/setup-cpp@v1
        with:
          compiler: llvm-${{ env.LLVM_VERSION }}
          cmake: true
          ninja: true
          setup-cpp: false
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: contract-${{ github.ref_name }}
          restore-keys: contract-
          max-size: 500M
      - name: Build shadercross
        uses: ./.github/actions/build-shadercross
      - name: Build the engine with the MCP client
        uses: lukka/run-cmake@v10
        with:
          configurePreset: linux-clients
          configurePresetAdditionalArgs: '["-DCATA_FORMAT_TARGETS=OFF"]'
          buildPreset: linux-clients
      - name: Check the examples
        run: |
          export BN_BINARY="$(find out/build/linux-clients -name cataclysm-bn -type f -perm -u+x | head -n 1)"
          deno task contract:check
