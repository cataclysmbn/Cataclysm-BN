name: Install Linux dependencies
description: Install the Ubuntu packages that Linux builds or test runs need

inputs:
  for:
    description: "`build` installs the development packages, `test` installs only what test executables load"
    default: build

runs:
  using: composite
  steps:
    # Ubuntu mirrors sometimes send packages at about 56 kB/s, so keep the downloaded packages in the cache.
    - id: restore
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/apt-archives
        key: apt-${{ runner.os }}-${{ runner.arch }}
        restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-

    - id: install
      shell: bash
      env: { FOR: "${{ inputs.for }}", KEY: "apt-${{ runner.os }}-${{ runner.arch }}" }
      run: |
        # The runner image already has the shared libraries that the test executables link.
        test_packages=(mesa-vulkan-drivers xvfb)
        if [ "$FOR" = "test" ]; then
          packages=("${test_packages[@]}")
        else
          packages=(libncursesw5-dev mold gettext parallel libsqlite3-dev zlib1g-dev libvulkan-dev
            autoconf autoconf-archive automake libtool libltdl-dev
            libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libx11-dev
            libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev
            libibus-1.0-dev libudev-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev
            libfreetype-dev libharfbuzz-dev
            libtiff-dev libavif-dev libwebp-dev libjpeg-dev libjxl-dev
            libflac-dev libvorbis-dev libxmp-dev libmpg123-dev libwavpack-dev)
        fi
        archives="$HOME/.cache/apt-archives"
        mkdir -p "$archives/partial"
        sudo apt-get update
        sudo apt-get install -y -o Dir::Cache::Archives="$archives" "${packages[@]}"
        # Test jobs do not run on main, so main build jobs also download the test packages into the cache.
        sudo apt-get install -y --download-only -o Dir::Cache::Archives="$archives" "${test_packages[@]}"
        # Drop package versions that the mirrors no longer have, so the cache does not grow.
        sudo apt-get autoclean -o Dir::Cache::Archives="$archives"
        # apt leaves a root-only lock file, and the cache save step cannot read it.
        sudo chown -R "$(id -u):$(id -g)" "$archives"
        echo "key=$KEY-$(ls "$archives"/*.deb 2>/dev/null | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
        if [ "$FOR" = "test" ]; then
          sudo locale-gen en_US.UTF-8 fr_FR.UTF-8 ru_RU.UTF-8
        fi

    # A PR cannot read the caches of other PRs, so save from main only. Skip the save when no package changed.
    - id: save
      if: github.ref_name == 'main' && steps.install.outputs.key != steps.restore.outputs.cache-matched-key
      uses: actions/cache/save@v5
      with:
        path: ~/.cache/apt-archives
        key: ${{ steps.install.outputs.key }}

    # prune-caches.yml deletes only copies with a timestamp, so delete the old apt copies here.
    # Keep them when the new copy is missing, for example after a failed upload.
    - if: steps.save.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PREFIX: apt-${{ runner.os }}-${{ runner.arch }}-
        KEY: ${{ steps.install.outputs.key }}
      run: |
        gh cache list --ref "$GITHUB_REF" --key "$PREFIX" --json id,key \
          --jq 'if any(.[]; .key == $ENV.KEY) then .[] | select(.key != $ENV.KEY) | .id else empty end' |
          xargs -r -n1 gh cache delete
