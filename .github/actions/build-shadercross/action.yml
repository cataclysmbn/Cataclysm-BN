name: Build shadercross
description: Build the host shader compiler without vcpkg

runs:
  using: composite
  steps:
    # Shadercross.cmake follows SDL_shadercross main, and a binary built on a newer runner image may not load on an older one.
    - id: upstream
      shell: bash
      run: |
        echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
        sha=$(git ls-remote https://github.com/libsdl-org/SDL_shadercross.git refs/heads/main | cut -f1)
        test -n "$sha"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    # Cache only the executable and its shared libraries; RUNPATH points to these build tree paths.
    - id: cache
      uses: actions/cache@v5
      with:
        path: |
          ${{ runner.temp }}/shadercross/bin
          ${{ runner.temp }}/shadercross/_deps/sdl3-build/*.so*
          ${{ runner.temp }}/shadercross/_deps/sdl3_shadercross-build/*.so*
          ${{ runner.temp }}/shadercross/_deps/sdl3_shadercross-build/DirectXShaderCompiler-binaries/linux/lib
        key: shadercross-${{ steps.upstream.outputs.image }}-${{ runner.arch }}-${{ steps.upstream.outputs.sha }}-${{ hashFiles('build-scripts/Shadercross.cmake', 'build-scripts/shadercross/CMakeLists.txt', '.github/actions/build-shadercross/action.yml') }}

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cmake -S build-scripts/shadercross -B "$RUNNER_TEMP/shadercross" -DCMAKE_BUILD_TYPE=Release
        cmake --build "$RUNNER_TEMP/shadercross" --target shadercross --parallel 2

    - shell: bash
      run: |
        echo "SHADERCROSS=$RUNNER_TEMP/shadercross/bin/shadercross" >> "$GITHUB_ENV"
        echo "$RUNNER_TEMP/shadercross/bin" >> "$GITHUB_PATH"
